<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сброс пароля — biolink</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page">
    <div class="glass card">
      <div class="brand"><span class="brand__dot"></span>biolink</div>
      <h1 class="hero" style="font-size:1.5rem">Сброс пароля</h1>
      <p class="lede">Напиши боту команду <b>/reset</b> — он пришлёт код для этого аккаунта.</p>

      <div class="error-box" id="err"></div>
      <div class="error-box" id="ok" style="background:rgba(34,211,238,.12); border-color:rgba(34,211,238,.35); color:#a8f0ff"></div>

      <form id="form">
        <div class="field">
          <label for="username">Логин</label>
          <input id="username" name="username" required>
        </div>
        <div class="field">
          <label for="code">Код из бота</label>
          <input id="code" name="code" inputmode="numeric" maxlength="6" required>
        </div>
        <div class="field">
          <label for="password">Новый пароль</label>
          <input id="password" name="password" type="password" placeholder="Минимум 6 символов" required>
        </div>
        <button class="btn btn--primary" type="submit">Сменить пароль</button>
      </form>

      <p class="hint"><a href="/login.html">Вернуться ко входу</a></p>
    </div>
  </div>

  <script src="/js/scene.js"></script>
  <script src="/js/api.js"></script>
  <script>
    mountScene({ blur: 30, brightness: 0.65 });
    mountCursorGlow();

    const form = document.getElementById('form');
    const errBox = document.getElementById('err');
    const okBox = document.getElementById('ok');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');
      okBox.classList.remove('show');

      const username = document.getElementById('username').value.trim();
      const code = document.getElementById('code').value.trim();
      const newPassword = document.getElementById('password').value;

      try {
        await API.request('/auth/reset/confirm', { method: 'POST', body: { username, code, newPassword } });
        okBox.textContent = 'Пароль обновлён. Сейчас перекинем ко входу…';
        okBox.classList.add('show');
        setTimeout(() => { window.location.href = '/login.html'; }, 1400);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.add('show');
      }
    });
  </script>
</body>
</html>
