<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>biolink</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .profile-card { padding: 34px 28px; }
  #notFound { display: none; text-align: center; }
</style>
</head>
<body>
  <div class="page">
    <div id="loading" class="hint">Загрузка…</div>

    <div class="glass card profile-card" id="profileCard" style="display:none">
      <div class="profile-avatar"><img id="avatarImg" src="" alt=""></div>
      <div class="profile-name" id="nameEl"></div>
      <div class="profile-bio" id="bioEl"></div>
      <div class="profile-socials" id="socialsEl"></div>
      <div class="player paused" id="player" style="display:none">
        <button class="player__toggle" id="playToggle" aria-label="Воспроизвести">▶</button>
        <div class="player__meta">
          <div class="player__title" id="trackTitle"></div>
        </div>
        <div class="player__bars"><span></span><span></span><span></span><span></span></div>
      </div>
      <audio id="audio" preload="none"></audio>
    </div>

    <div class="glass card" id="notFound">
      <h1 class="hero" style="font-size:1.3rem">Страница не найдена</h1>
      <p class="lede" style="margin-bottom:0">Такого пользователя нет — проверь ссылку.</p>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/scene.js"></script>
  <script src="/js/particles.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
