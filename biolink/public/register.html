<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация — biolink</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .step { display: none; }
  .step.active { display: block; }
  .code-display {
    text-align: center; font-family: var(--font-display); font-size: 2.1rem;
    letter-spacing: 0.12em; margin: 6px 0 18px;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .status-line { display: flex; align-items: center; gap: 8px; justify-content: center; color: var(--text-dim); font-size: 0.85rem; margin-bottom: 18px; }
  .dot-pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <div class="page">
    <div class="glass card">
      <div class="brand"><span class="brand__dot"></span>biolink</div>

      <!-- Шаг 1: форма -->
      <div class="step active" id="step1">
        <h1 class="hero" style="font-size:1.5rem">Регистрация</h1>
        <p class="lede">Логин, пароль и твой Telegram — бот привяжет аккаунт к нему.</p>

        <div class="error-box" id="err"></div>

        <form id="form">
          <div class="field">
            <label for="username">Логин</label>
            <input id="username" name="username" placeholder="anvarbek" required>
          </div>
          <div class="field">
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" placeholder="Минимум 6 символов" required>
          </div>
          <div class="field">
            <label for="telegram">Telegram ID или username</label>
            <input id="telegram" name="telegram" placeholder="@username или числовой ID" required>
          </div>
          <button class="btn btn--primary" type="submit">Продолжить</button>
        </form>

        <p class="hint">Уже есть аккаунт? <a href="/login.html">Войти</a></p>
      </div>

      <!-- Шаг 2: подтверждение в боте -->
      <div class="step" id="step2">
        <h1 class="hero" style="font-size:1.5rem">Осталось подтвердить</h1>
        <p class="lede">Открой бота — он уже знает этот код.</p>

        <div class="code-display" id="codeDisplay"></div>

        <a class="btn btn--primary" id="botLink" href="#" target="_blank" style="margin-bottom:12px">
          Открыть бота и подтвердить →
        </a>
        <p class="hint" style="margin-bottom:18px">
          Не открылось само? Отправь боту вручную: <b>/confirm <span id="codeInline"></span></b>
        </p>

        <div class="status-line"><span class="dot-pulse"></span><span id="statusText">Ждём подтверждения…</span></div>
      </div>
    </div>
  </div>

  <script src="/js/scene.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script>
    mountScene({ blur: 30, brightness: 0.65 });
    mountCursorGlow();

    const form = document.getElementById('form');
    const errBox = document.getElementById('err');
    let pollTimer = null;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const telegram = document.getElementById('telegram').value.trim();

      try {
        const { code } = await API.request('/auth/register/start', {
          method: 'POST',
          body: { username, password, telegram }
        });
        showStep2(code);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.add('show');
      }
    });

    function showStep2(code) {
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
      document.getElementById('codeDisplay').textContent = code;
      document.getElementById('codeInline').textContent = code;
      document.getElementById('botLink').href = `https://t.me/${BOT_USERNAME}?start=confirm_${code}`;

      pollTimer = setInterval(() => pollClaim(code), 2000);
    }

    async function pollClaim(code) {
      let data;
      try {
        data = await API.request(`/auth/register/claim/${code}`);
      } catch {
        return;
      }

      if (data.status === 'confirmed') {
        clearInterval(pollTimer);
        document.getElementById('statusText').textContent = 'Готово! Заходим…';
        API.setToken(data.token);
        setTimeout(() => { window.location.href = '/dashboard.html'; }, 600);
      } else if (data.status === 'expired') {
        clearInterval(pollTimer);
        document.getElementById('statusText').textContent = 'Код истёк — обнови страницу и попробуй снова.';
      }
    }
  </script>
</body>
</html>
